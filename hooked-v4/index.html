const ROOT='https://raw.githubusercontent.com/tmsrecording-cyber/code-tracking/b14dc21f230b986142ecf8bd2c15b7fa703a8b63/hooked-v4/catalog/',API='https://hooked-v2-brighter.vercel.app/api/music',$=x=>document.getElementById(x),L={rock:'Rock / alt',metal:'Melodic heavy',punk:'Punk / pop-punk',electronic:'Electronic',groove:'Hip-hop / funk',roots:'Roots / country / blues',world:'World / Latin / Asian / African',alt:'Indie / alt'};let T=[],player,ready=0,Q=[],p=0,C=[],ci=0,vid='',hist=[],hp=-1,hid=0,armed=0,timer,B=new Set,V=new Set;try{B=new Set(JSON.parse(localStorage.getItem('hv4b')||'[]'));V=new Set(JSON.parse(localStorage.getItem('hv4v')||'[]'))}catch{}async function data(){let z=(await Promise.all([0,1,2,3].map(i=>fetch(ROOT+i+'.txt').then(r=>r.text())))).join(''),raw=Uint8Array.from(atob(z),c=>c.charCodeAt(0)),stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}function save(){try{localStorage.setItem('hv4b',JSON.stringify([...B]));localStorage.setItem('hv4v',JSON.stringify([...V]))}catch{}}function k(t){return t[0]+'|||'+t[1]}function mix(a){for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}function shuffleQ(){let m=new Map;T.forEach((t,i)=>{if(B.has(k(t)))return;if(!m.has(t[3]))m.set(t[3],[]);m.get(t[3]).push(i)});for(let a of m.values())mix(a);let o=[],r=[];while([...m.values()].some(a=>a.length)){let f=[...m.keys()].filter(x=>m.get(x).length&&!r.includes(x));if(!f.length)f=[...m.keys()].filter(x=>m.get(x).length);f.sort((a,b)=>m.get(b).length-m.get(a).length);let top=f.slice(0,Math.min(3,f.length)),x=top[Math.random()*top.length|0];o.push(m.get(x).pop());r.push(x);if(r.length>2)r.shift()}return o}function cur(){return T[Q[p]]}function ui(){if(!Q.length)return;let t=cur();counter.textContent=`Song ${p+1} of ${Q.length}`;title.textContent=t[0]+' — '+t[1];meta.textContent=(L[t[3]]||t[3])+' · '+t[2];armed=0;block.textContent='Never play again'}asyn
